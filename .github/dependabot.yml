# Daily checks on third-party dependencies, each waiting out a 7-day cooldown
# so a release has time to be withdrawn before it reaches a site.
version: 2
updates:
  # The @museumwnf platform packages are IGNORED here, and that is no longer
  # about Dependabot being unable to read them — they publish publicly to
  # npmjs now, which Dependabot resolves without a token.
  #
  # They are ignored because viewer-core, viewer-layout, viewer-i18n and this
  # site's own data package are updated deliberately, through the
  # release-then-propagate procedure in metanull/viewer-workflows
  # (`tools/propagate.mjs`): a bump lands here as its own pull request right
  # after each platform release, not whenever Dependabot happens to notice a
  # new version. A Dependabot bump of these packages would land outside that
  # procedure and skip the cross-site sequencing it exists for.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@museumwnf/*"

  # The reusable workflows in metanull/viewer-workflows are pinned to an exact
  # version in .github/workflows/*.yml, never to a moving major tag. Dependabot
  # covers reusable-workflow refs as well as step-level actions, so a new
  # viewer-workflows release arrives here as a pull request that runs this
  # site's own CI before it is adopted — instead of a force-moved `v1`
  # deploying untested CI to every repo at once. Green minor/patch bumps
  # auto-merge via automerge.yml; majors wait for a human.
  #
  # This ecosystem is unaffected by the problem above: it resolves against the
  # GitHub API, not against npm.pkg.github.com.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
